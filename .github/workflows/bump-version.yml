name: Bump Version & Release

# Two ways to cut a release:
#   1. Label a PR `release:patch|minor|major` and merge it — the label picks the
#      bump; on merge this workflow bumps pyproject.toml, promotes the CHANGELOG
#      [Unreleased] section, tags, and creates a GitHub Release.
#   2. Run it manually (Actions → Bump Version & Release → Run workflow) and
#      choose the bump.
# In both cases the GitHub Release notes come from the promoted CHANGELOG section.
on:
    workflow_dispatch:
        inputs:
            bump:
                description: "Version bump type"
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major
    pull_request:
        types: [closed]
        branches: [main]

permissions:
    contents: write
    pull-requests: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    bump:
        name: Bump & Release
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # Run on a manual dispatch from main, or on a merged (not just closed)
        # non-fork PR that carries a release:* label. Dependabot never releases.
        if: >-
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
            (github.event.pull_request.merged == true &&
             github.event.pull_request.head.repo.fork == false &&
             github.event.pull_request.user.login != 'dependabot[bot]' &&
             (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
              contains(github.event.pull_request.labels.*.name, 'release:minor') ||
              contains(github.event.pull_request.labels.*.name, 'release:major')))
        env:
            # On a pull_request event github.ref is the merge ref, so resolve the
            # real branch the bump commit + tag should land on.
            TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
                  fetch-depth: 0

            - name: Resolve release parameters
              id: params
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DISPATCH_BUMP: ${{ inputs.bump }}
                  PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                      BUMP="$DISPATCH_BUMP"
                  elif echo "$PR_LABELS" | grep -q 'release:major'; then
                      BUMP=major
                  elif echo "$PR_LABELS" | grep -q 'release:minor'; then
                      BUMP=minor
                  else
                      BUMP=patch
                  fi
                  echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
                  echo "Resolved bump: $BUMP"

            - name: Get current version
              id: current
              run: |
                  VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Current version: $VERSION"

            - name: Calculate next version
              id: next
              run: |
                  IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.version }}"
                  case "${{ steps.params.outputs.bump }}" in
                      major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                      minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                      patch) PATCH=$((PATCH + 1)) ;;
                  esac
                  NEXT="${MAJOR}.${MINOR}.${PATCH}"
                  echo "version=$NEXT" >> "$GITHUB_OUTPUT"
                  echo "Next version: $NEXT"

            - name: Update pyproject.toml
              run: |
                  sed -i "s/^version = \".*\"/version = \"${{ steps.next.outputs.version }}\"/" pyproject.toml
                  echo "Updated pyproject.toml:"
                  grep '^version' pyproject.toml

            - name: Roll changelog Unreleased section
              run: |
                  VERSION="${{ steps.next.outputs.version }}"
                  TODAY=$(date -u +%Y-%m-%d)
                  if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
                      # Promote [Unreleased] to the release heading and re-seed a
                      # fresh empty [Unreleased] above it for the next cycle.
                      sed -i "s|^## \[Unreleased\]|## [Unreleased]\n\n## [${VERSION}] - ${TODAY}|" CHANGELOG.md
                      echo "Promoted [Unreleased] to [${VERSION}] - ${TODAY} and re-seeded [Unreleased]"
                  else
                      echo "No [Unreleased] section — CHANGELOG.md left untouched"
                  fi

            - name: Commit version bump
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add pyproject.toml CHANGELOG.md
                  git commit -m "chore: bump version to ${{ steps.next.outputs.version }}"
                  git push origin "HEAD:${{ env.TARGET_BRANCH }}"

            - name: Create and push tag
              run: |
                  VERSION="${{ steps.next.outputs.version }}"
                  if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
                      echo "::error::Tag v${VERSION} already exists — bump the version or delete the tag."
                      exit 1
                  fi
                  git tag "v${VERSION}"
                  git push origin "v${VERSION}"
                  echo "Tagged: v${VERSION}"

            - name: Create GitHub Release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="${{ steps.next.outputs.version }}"
                  # Extract this version's CHANGELOG section (between its heading
                  # and the next "## [" heading), dropping leading blank lines.
                  awk -v ver="$VERSION" '
                      BEGIN { gsub(/\./, "\\.", ver) }
                      $0 ~ "^## \\[" ver "\\]" { found=1; next }
                      found && /^## \[/ { exit }
                      found { print }
                  ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
                  if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
                      URL=$(gh release create "v${VERSION}" --title "v${VERSION}" \
                          --notes-file "$RUNNER_TEMP/release-notes.md")
                  else
                      echo "No CHANGELOG section for ${VERSION} — using generated notes"
                      URL=$(gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes)
                  fi
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "Released: $URL"

            - name: Summary
              run: |
                  echo "### Version Bumped" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| | |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Type** | ${{ steps.params.outputs.bump }} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Previous** | ${{ steps.current.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **New** | ${{ steps.next.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Tag** | v${{ steps.next.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| **Release** | ${{ steps.release.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
