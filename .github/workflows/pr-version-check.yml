name: PR - Version Check

# Guards against accidental version downgrades: fails a PR whose pyproject.toml
# version is LOWER than the base branch. Equal is allowed (the release workflow
# bumps at release time); higher is allowed (a deliberate in-PR bump).
on:
    pull_request:
        branches: [main]

jobs:
    version-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Version must not go backwards
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  set -euo pipefail
                  read_ver() { grep -m1 '^version' "$1" | sed 's/.*"\(.*\)"/\1/'; }

                  HEAD_VER=$(read_ver pyproject.toml)
                  git fetch --no-tags --depth=1 origin "$BASE_REF"
                  git show "FETCH_HEAD:pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml"
                  BASE_VER=$(read_ver "$RUNNER_TEMP/base-pyproject.toml")

                  for pair in "base:$BASE_VER" "PR:$HEAD_VER"; do
                      name="${pair%%:*}"; ver="${pair#*:}"
                      if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                          echo "::error::${name} version '${ver}' is not MAJOR.MINOR.PATCH."
                          exit 1
                      fi
                  done

                  if [ "$HEAD_VER" = "$BASE_VER" ]; then
                      echo "PR version = base ($HEAD_VER); the release workflow bumps at release time."
                  else
                      # Semantic version sort; if HEAD sorts first it is the lower one.
                      LOWEST=$(printf '%s\n%s\n' "$BASE_VER" "$HEAD_VER" | sort -V | head -n1)
                      if [ "$LOWEST" = "$HEAD_VER" ]; then
                          echo "::error::PR version ($HEAD_VER) is LESS than base ($BASE_VER). Version cannot go backwards — bump it or rebase."
                          exit 1
                      fi
                      echo "PR bumps version $BASE_VER -> $HEAD_VER."
                  fi
